<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background Circle -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#52A538" stroke-width="7"/>
  <circle cx="250" cy="250" r="242" fill="none" stroke="#52A538" stroke-width="2"/>
  
  <!-- Outer Curved Text Pathway -->
  <path id="textPathTop" d="M 50 250 A 200 200 0 0 1 450 250" fill="none" />
  <path id="textPathBottom" d="M 450 250 A 200 200 0 0 1 50 250" fill="none" />

  <!-- Circular Text -->
  <text font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#802B82" letter-spacing="4">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      ★ VENKATA GANAPATHI ★
    </textPath>
  </text>
  
  <text font-family="Arial, sans-serif" font-weight="900" font-size="26" fill="#101827" letter-spacing="3">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      PHYSIOTHERAPY CLINIC
    </textPath>
  </text>

  <!-- Laurel Wreath Decoration (Inner Ring) -->
  <circle cx="250" cy="250" r="170" fill="none" stroke="#68B946" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Medical Cross Center -->
  <g transform="translate(250, 250)">
    <!-- Main Cross Boundary -->
    <path d="M -35 -90 L 35 -90 L 35 -35 L 90 -35 L 90 35 L 35 35 L 35 90 L -35 90 L -35 35 L -90 35 L -90 -35 L -35 -35 Z" 
          fill="#FFFFFF" stroke="#52A538" stroke-width="8" stroke-linejoin="round" />

    <!-- Top Ring Handle -->
    <ellipse cx="0" cy="-100" rx="14" ry="18" fill="none" stroke="#52A538" stroke-width="6"/>

    <!-- Stethoscope Center Icon -->
    <g transform="scale(0.85)">
      <!-- Heart Center -->
      <path d="M 0 10 C -12 -10 -30 -5 -25 12 C -20 28 0 40 0 40 C 0 40 20 28 25 12 C 30 -5 12 -10 0 10 Z" 
            fill="none" stroke="#E11D48" stroke-width="4" stroke-linecap="round"/>
      <!-- Stethoscope Tubes & Chestpiece -->
      <path d="M -18 -15 C -25 -35 -15 -45 0 -45 C 15 -45 25 -35 18 -15" 
            fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-18" cy="-15" r="4" fill="#1E293B" />
      <circle cx="18" cy="-15" r="4" fill="#1E293B" />
      <path d="M 0 40 L 0 52 C 0 58 12 58 12 52" fill="none" stroke="#1E293B" stroke-width="5"/>
      <circle cx="12" cy="50" r="7" fill="#1E293B"/>
    </g>

    <!-- Top Arm: Wheelchair -->
    <g transform="translate(0, -62) scale(0.65)">
      <circle cx="-5" cy="-15" r="5" fill="#0284C7"/>
      <path d="M -5 -8 L -5 8 L 8 8 L 12 20 M -5 0 L 8 0" fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="12" r="10" fill="none" stroke="#0284C7" stroke-width="4"/>
    </g>

    <!-- Left Arm: Bed Patient -->
    <g transform="translate(-60, 2) scale(0.65)">
      <circle cx="-15" cy="-8" r="4.5" fill="#0284C7"/>
      <path d="M -25 8 L 25 8 M -20 8 L -20 16 M 20 8 L 20 16 M -20 2 L 18 2 L 8 -4 L -8 -4 Z" 
            fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Right Arm: Doctor/Therapist Assistance -->
    <g transform="translate(60, 0) scale(0.65)">
      <circle cx="0" cy="-18" r="5" fill="#0284C7"/>
      <path d="M 0 -11 L -5 5 L -15 20 M -5 5 L 8 20 M 0 -5 L 12 -10" 
            fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Bottom Arm: Running/Rehab Figure -->
    <g transform="translate(0, 62) scale(0.65)">
      <circle cx="5" cy="-18" r="5" fill="#0284C7"/>
      <path d="M 5 -10 L -2 5 L -15 10 M -2 5 L 12 22 M 2 -3 L 15 -10 M -2 5 L -10 22" 
            fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
